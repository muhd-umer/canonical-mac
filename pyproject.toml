[project]
name = "multiuser-opt"
version = "0.1.0"
description = "Toolbox for multi-user MIMO optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy[cvxopt,mosek]>=1.7.3",
    "numba-cuda[cu12]>=0.20.1",
    "optuna>=4.5.0",
    "torch==2.8.0",
    "torch-geometric>=2.7.0",
    "torchvision==0.23.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
